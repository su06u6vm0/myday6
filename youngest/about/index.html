    <style>
        * {

        body {
            margin: 0;
            min-height: 100vh;
            background:

                linear-gradient(135deg, #F8FBFD, #FFFFFF);
            color: #34495E;
            font-family: 'Inter', sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

        }

        .container {

        .header {

        }

        .logo {

            color: #7FB8D2;
            margin-bottom: 25px;
        }

        h1 {

            font-size: clamp(42px, 10vw, 60px);

            margin-top: 14px;
            font-size: 13px;
            letter-spacing: 2px;
            color: #97CADD;
        }

        /* Content */
        .section {
            margin-bottom: 38px;
        }

        .section-title {
            font-size: 11px;
            letter-spacing: 3px;
            color: #7FB8D2;
            margin-bottom: 12px;
        }

        .section p {
            margin: 0;
            font-size: 14px;
            line-height: 1.9;
            color: #6B7C8C;
        }

        /* Creator */
        .creator {
            background: rgba(255,255,255,0.65);
            border: 1px solid #DCEFF7;
            border-radius: 18px;
            padding: 20px 22px;
            backdrop-filter: blur(10px);
        }

        .creator-name {
            font-size: 16px;
            font-weight: 600;
            color: #34495E;
        }

        .creator-role {
            margin-top: 5px;
            font-size: 12px;
            color: #9AAAB5;
        }

        /* Contact */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .contact-list a {
            color: #6B7C8C;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.25s ease;
        }

        .contact-list a:hover {
            color: #7FB8D2;
        }

        /* Disclaimer */

        .disclaimer {
            padding-top: 25px;
            border-top: 1px solid #DCEFF7;
        }

        .disclaimer p {
            font-size: 11px;
            line-height: 1.8;
            color: #9AAAB5;
        }

        /* Back */
        .back {
            margin-top: 50px;
            text-align: center;
        }

        .back a {
            color: #7FB8D2;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 2px;
            transition: opacity 0.25s ease;
        }

        .back a:hover {
            opacity: 0.6;
        }

        .chinese {
            margin-top: 12px !important;
            font-size: 13px !important;
            color: #9AAAB5 !important;
        }

        /* Footer */
        footer {
            margin-top: 35px;
            text-align: center;
            font-size: 11px;
            color: #9AAAB5;
            letter-spacing: 1px;
            font-family: 'Quicksand', sans-serif;
