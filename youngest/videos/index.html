<!DOCTYPE html>
<html lang="zh-TW">

<head>
	<meta charset="UTF-8">
	<link rel="icon" href="../images/icon.png" type="image/png">
	<link rel="apple-touch-icon" href="../images/icon.png">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>YOUNGEST | Video Archive</title>

	<link rel="stylesheet" href="video.css">
</head>

<body>

	<header>
		<h2>YOUNGEST | Video Archive</h2>
		<p>收錄《YOUNGEST》回歸期間的官方影音內容，
	包含 MV、預告、舞台演出、直播、綜藝節目、訪談及幕後花絮。</p>
	</header>

	<section class="filter" id="section-filter">
		<button onclick="filterVideos('All')">
			全部
		</button>

		<button onclick="filterVideos('M/V')">
			M/V
		</button>

		<button onclick="filterVideos('音樂節目')">
			音樂節目
		</button>

		<button onclick="filterVideos('Live 演唱')">
			Live 演唱
		</button>

		<button onclick="filterVideos('綜藝節目')">
			綜藝節目
		</button>

		<button onclick="filterVideos('電台/廣播')">
			電台/廣播
		</button>

		<button onclick="filterVideos('訪談')">
			訪談/其他
		</button>

		<button onclick="filterVideos('直播')">
			直播
		</button>

		<button onclick="filterVideos('幕後花絮')">
			幕後花絮
		</button>

		<button onclick="filterVideos('專輯相關')">
			專輯相關
		</button>
	</section>

	<main id="video-container">

	</main>

	<!-- 用來放置分頁按鈕的容器 -->
	<div id="pagination-container" class="pagination"></div>

	<script src="video.js"></script>

</body>

</html>
